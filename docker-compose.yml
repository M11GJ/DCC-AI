services:
  open-webui:
    build: .
    image: dccai-open-webui:custom
    container_name: open-webui
    depends_on:
      - litellm
    ports:
      - "3000:8080"                # 前段のリバースプロキシから 3000 へ
    volumes:
      - open-webui:/app/backend/data
    env_file:
      - ./open-webui.env
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - postgres
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - GEMINI_API_KEY_4=${GEMINI_API_KEY_4}
      - GEMINI_API_KEY_5=${GEMINI_API_KEY_5}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dccai-postgres
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    mem_limit: 256m
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dccai-cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiYTYwYWU2Y2RiNjhjMjU5YjZkOGZhOGM1YjM4NWNiMmEiLCJ0IjoiMmUyZGFhNTgtZTFjOS00OGJiLWIyY2QtNTYwNzI4YTM5MWYzIiwicyI6Ik5UZ3pOMll4TWpZdFl6YzBPQzAwT0RoaUxXSXpPVGN0TkRNd09Ea3pPVGM1TURnNCJ9
    network_mode: host
    restart: unless-stopped

  dashboard:
    image: python:3.11-slim
    container_name: dccai-dashboard
    volumes:
      - ./scripts/routing_dashboard.py:/app/routing_dashboard.py:ro
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: python3 /app/routing_dashboard.py
    environment:
      - PORT=3001
      - LITELLM_METRICS_URL=http://litellm:4000/metrics/
    ports:
      - "3001:3001"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    restart: unless-stopped

volumes:
  open-webui: {}
  ollama: {}
  searxng-cache: {}
  postgres-data: {}
