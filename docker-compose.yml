services:
  open-webui:
    build: .
    image: dccai-open-webui:custom
    container_name: open-webui
    depends_on:
      - litellm
    ports:
      - "3000:8080"                # 前段のリバースプロキシから 3000 へ
    volumes:
      - open-webui:/app/backend/data
    env_file:
      - ./open-webui.env
    mem_limit: 1536m
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - postgres
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - GEMINI_API_KEY_4=${GEMINI_API_KEY_4}
      - GEMINI_API_KEY_5=${GEMINI_API_KEY_5}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "127.0.0.1:4000:4000"
    mem_limit: 2048m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: dccai-postgres
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    mem_limit: 256m
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dccai-cloudflared
    command: tunnel --no-autoupdate --protocol http2 run --token eyJhIjoiYTYwYWU2Y2RiNjhjMjU5YjZkOGZhOGM1YjM4NWNiMmEiLCJ0IjoiMmUyZGFhNTgtZTFjOS00OGJiLWIyY2QtNTYwNzI4YTM5MWYzIiwicyI6Ik5UZ3pOMll4TWpZdFl6YzBPQzAwT0RoaUxXSXpPVGN0TkRNd09Ea3pPVGM1TURnNCJ9
    network_mode: host
    mem_limit: 256m
    restart: unless-stopped

  dashboard:
    image: python:3.11-slim
    container_name: dccai-dashboard
    volumes:
      - ./scripts/routing_dashboard.py:/app/routing_dashboard.py:ro
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: python3 /app/routing_dashboard.py
    environment:
      - PORT=3001
      - LITELLM_METRICS_URL=http://litellm:4000/metrics/
    ports:
      - "3001:3001"
    mem_limit: 128m
    restart: unless-stopped

  usage:
    image: python:3.11-slim
    container_name: dccai-usage
    depends_on:
      - postgres
    volumes:
      - ./scripts/usage_page.py:/app/usage_page.py:ro
      - open-webui:/webui-data:ro
    # litellmの/spend/logsはlimit/end_user_idフィルタが効かず全件(messages/response列込みで
    # 90MB超)返してくるため使わず、Postgresへ直接SQLで問い合わせる。psycopg2-binaryはビルド不要
    # なのでpython:3.11-slimでもpip installだけで動く。
    command: sh -c "pip install --quiet --no-cache-dir psycopg2-binary && python3 /app/usage_page.py"
    environment:
      - PORT=3002
      - PUBLIC_BASE_URL=https://usage.shu-dcc.net
      - REQUIRED_GUILD_ID=1304292402386964502
      - WEBUI_DB_PATH=/webui-data/webui.db
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - USAGE_SESSION_SECRET=${USAGE_SESSION_SECRET}
    ports:
      - "3002:3002"
    mem_limit: 256m
    restart: unless-stopped

  # ollama:
  #   旧ホスト(desktop-1f999hf, RTX 4060)に残置。GPU無しのgunkでは実行しない
  #   dccai_pipe.py の OLLAMA_BASE_URL を http://100.80.194.51:11434 に向けて利用

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    mem_limit: 512m
    restart: unless-stopped

volumes:
  open-webui: {}
  searxng-cache: {}
  postgres-data: {}
