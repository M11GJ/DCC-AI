model_list:
  # ---- Low：DeepSeek V4 Flash Vision Experimental / high effort ----
  - model_name: dccai-low
    litellm_params:
      # DeepSeek専用adapterは未登録のVisionモデルをtext-only扱いして画像を落とすため、
      # OpenAI互換経路で公式APIへ直通する。
      model: openai/deepseek-v4-flash-vision-exp
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      allowed_openai_params: [reasoning_effort]
      reasoning_effort: high
      extra_body:
        thinking: { type: enabled }
      rpm: 60
    model_info: { id: "DeepSeek V4 Flash Vision Exp (High Effort)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Geminiプール（一時停止中） ----
  # 復活時はこのブロックとdocker-compose.ymlのGEMINI_API_KEY行をコメント解除し、
  # マーカー名をGEMINI_LOW_START/GEMINI_LOW_ENDへ戻してfallbacksへ追加する。
  # >>> GEMINI_DISABLED_START <<<
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_1
  #     rpm: 60
  #   model_info: { id: "Gemini Key 1", input_cost_per_token: 0, output_cost_per_token: 0 }
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_2
  #     rpm: 60
  #   model_info: { id: "Gemini Key 2", input_cost_per_token: 0, output_cost_per_token: 0 }
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_3
  #     rpm: 60
  #   model_info: { id: "Gemini Key 3", input_cost_per_token: 0, output_cost_per_token: 0 }
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_4
  #     rpm: 60
  #   model_info: { id: "Gemini Key 4", input_cost_per_token: 0, output_cost_per_token: 0 }
  # >>> GEMINI_DISABLED_END <<<

  # ---- High：DeepSeek V4 Flash Vision Experimental / max effort ----
  - model_name: dccai-high
    litellm_params:
      # DeepSeek専用adapterは未登録のVisionモデルをtext-only扱いして画像を落とすため、
      # OpenAI互換経路で公式APIへ直通する。
      model: openai/deepseek-v4-flash-vision-exp
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      allowed_openai_params: [reasoning_effort]
      reasoning_effort: max
      extra_body:
        thinking: { type: enabled }
      rpm: 30
    model_info: { id: "DeepSeek V4 Flash Vision Exp (Max Effort)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Code：DeepSeek V4 Flash Vision Experimental / max effort ----
  - model_name: dccai-code
    litellm_params:
      # CodeもHigh/Lowと同じネイティブマルチモーダルモデルを使う。
      # 公開ID(dccai-code)は変更しない。
      model: openai/deepseek-v4-flash-vision-exp
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      allowed_openai_params: [reasoning_effort]
      reasoning_effort: max
      extra_body:
        thinking: { type: enabled }
      rpm: 30
    model_info: { id: "DeepSeek V4 Flash Vision Exp Code (Max Effort)", input_cost_per_token: 0, output_cost_per_token: 0 }

litellm_settings:
  num_retries: 2
  request_timeout: 1200
  # 旧Cerebras/Featherless経路は契約・モデル廃止で失敗するため削除。
  # 同じDeepSeekキーへ別名でフォールバックしても冗長化にならず、モデル別集計も
  # 汚すため、自動リトライだけを使う。新しい有効な別プロバイダーを用意した時に再設定する。
  fallbacks: []
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # Open WebUI(Pipe) からの認証キー
  database_url: os.environ/DATABASE_URL       # spend/トークン使用量の永続化用(Postgres)
  store_model_in_db: false                    # モデル定義はconfig.yamlのみで管理(DBに二重管理させない)
