model_list:
  # ---- Low：DeepSeek V4 Flash Vision Experimental / high effort ----
  - model_name: dccai-low
    litellm_params:
      # DeepSeek専用adapterは未登録のVisionモデルをtext-only扱いして画像を落とすため、
      # OpenAI互換経路で公式APIへ直通する。
      model: openai/deepseek-v4-flash-vision-exp
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      allowed_openai_params: [reasoning_effort]
      reasoning_effort: high
      extra_body:
        thinking: { type: enabled }
      rpm: 60
    model_info: { id: "DeepSeek V4 Flash Vision Exp (High Effort)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Geminiプール（一時停止中） ----
  # 復活時はこのブロックとdocker-compose.ymlのGEMINI_API_KEY行をコメント解除し、
  # マーカー名をGEMINI_LOW_START/GEMINI_LOW_ENDへ戻してfallbacksへ追加する。
  # >>> GEMINI_DISABLED_START <<<
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_1
  #     rpm: 60
  #   model_info: { id: "Gemini Key 1", input_cost_per_token: 0, output_cost_per_token: 0 }
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_2
  #     rpm: 60
  #   model_info: { id: "Gemini Key 2", input_cost_per_token: 0, output_cost_per_token: 0 }
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_3
  #     rpm: 60
  #   model_info: { id: "Gemini Key 3", input_cost_per_token: 0, output_cost_per_token: 0 }
  # - model_name: dccai-low-legacy
  #   litellm_params:
  #     model: gemini/gemini-3.1-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_4
  #     rpm: 60
  #   model_info: { id: "Gemini Key 4", input_cost_per_token: 0, output_cost_per_token: 0 }
  # >>> GEMINI_DISABLED_END <<<

  # ---- High：DeepSeek V4 Flash Vision Experimental / max effort ----
  - model_name: dccai-high
    litellm_params:
      # DeepSeek専用adapterは未登録のVisionモデルをtext-only扱いして画像を落とすため、
      # OpenAI互換経路で公式APIへ直通する。
      model: openai/deepseek-v4-flash-vision-exp
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      allowed_openai_params: [reasoning_effort]
      reasoning_effort: max
      extra_body:
        thinking: { type: enabled }
      rpm: 30
    model_info: { id: "DeepSeek V4 Flash Vision Exp (Max Effort)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- High(フォールバック)：Cerebras と DeepSeek V3 (Featherless) を並列で負荷分散（ラウンドロビン） ----
  - model_name: dccai-high-legacy
    litellm_params:
      model: cerebras/llama-3.3-70b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 30
    model_info: { id: "Cerebras Llama-3.3-70b", input_cost_per_token: 0, output_cost_per_token: 0 }

  - model_name: dccai-high-legacy
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V3-0324
      api_base: https://api.featherless.ai/v1
      api_key: os.environ/FEATHERLESS_API_KEY
      rpm: 30
    model_info: { id: "DeepSeek-V3 (Featherless)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Code：DeepSeek V4 Flash (0731) / max effort ----
  - model_name: dccai-code
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      reasoning_effort: max
      thinking: { type: enabled }
      rpm: 30
    model_info: { id: "DeepSeek V4 Flash (0731, Max Effort)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Backup Low：DeepSeek系が使えない時のフェイルオーバー ----
  - model_name: dccai-backup-low
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_base: https://api.featherless.ai/v1
      api_key: os.environ/FEATHERLESS_API_KEY
      rpm: 60
    model_info: { id: "Qwen-2.5-7B (Featherless Backup)", input_cost_per_token: 0, output_cost_per_token: 0 }

litellm_settings:
  num_retries: 2
  request_timeout: 1200
  # 公開model_nameは固定。Geminiは一時停止し、既存の非Gemini系バックアップだけを残す。
  fallbacks: [{"dccai-high": ["dccai-high-legacy"]}, {"dccai-high-legacy": ["dccai-low"]}, {"dccai-low": ["dccai-backup-low"]}, {"dccai-code": ["dccai-high"]}]
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # Open WebUI(Pipe) からの認証キー
  database_url: os.environ/DATABASE_URL       # spend/トークン使用量の永続化用(Postgres)
  store_model_in_db: false                    # モデル定義はconfig.yamlのみで管理(DBに二重管理させない)
