model_list:
  # ---- Low：既定・全員・高速。まず DeepSeek v4-pro、失敗時は Gemini プールへ ----
  - model_name: dccai-low
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 60
    model_info: { id: "DeepSeek V4 Pro", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Low(フォールバック)：Gemini プール ----
  # ※LiteLLMの機能で、同じmodel_nameを複数書くと自動的にラウンドロビン（並列負荷分散）されます。
  # >>> GEMINI_LOW_START (gemini-key-health が自動管理。手動編集しないこと) <<<
  - model_name: dccai-low-legacy
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_1
      rpm: 60
    model_info: { id: "Gemini Key 1", input_cost_per_token: 0, output_cost_per_token: 0 }
  - model_name: dccai-low-legacy
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_2
      rpm: 60
    model_info: { id: "Gemini Key 2", input_cost_per_token: 0, output_cost_per_token: 0 }
  - model_name: dccai-low-legacy
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_3
      rpm: 60
    model_info: { id: "Gemini Key 3", input_cost_per_token: 0, output_cost_per_token: 0 }
  - model_name: dccai-low-legacy
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY_4
      rpm: 60
    model_info: { id: "Gemini Key 4", input_cost_per_token: 0, output_cost_per_token: 0 }
  # >>> GEMINI_LOW_END <<<

  # ---- High：重い課題向け。まず DeepSeek v4-flash(0731)、失敗時は旧Highプールへ ----
  # ベンチマーク(DeepSeek公式、2026-07-31版)でV4-Flash-0731がV4-Pro-Previewを上回ったため
  # Low/Highの中身を入れ替え。API側のmodel名は不変(deepseek-v4-flashが0731を指す)
  - model_name: dccai-high
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      rpm: 30
    model_info: { id: "DeepSeek V4 Flash (0731)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- High(フォールバック)：Cerebras と DeepSeek V3 (Featherless) を並列で負荷分散（ラウンドロビン） ----
  - model_name: dccai-high-legacy
    litellm_params:
      model: cerebras/llama-3.3-70b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 30
    model_info: { id: "Cerebras Llama-3.3-70b", input_cost_per_token: 0, output_cost_per_token: 0 }

  - model_name: dccai-high-legacy
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V3-0324
      api_base: https://api.featherless.ai/v1
      api_key: os.environ/FEATHERLESS_API_KEY
      rpm: 30
    model_info: { id: "DeepSeek-V3 (Featherless)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Code：コーディング用途。GLM-5.2 (Featherless) ----
  - model_name: dccai-code
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.featherless.ai/v1
      api_key: os.environ/FEATHERLESS_API_KEY
      rpm: 30
    model_info: { id: "GLM-5.2 (Featherless)", input_cost_per_token: 0, output_cost_per_token: 0 }

  # ---- Backup Low：Geminiが使えない時のフェイルオーバー ----
  - model_name: dccai-backup-low
    litellm_params:
      model: openai/Qwen/Qwen2.5-7B-Instruct
      api_base: https://api.featherless.ai/v1
      api_key: os.environ/FEATHERLESS_API_KEY
      rpm: 60
    model_info: { id: "Qwen-2.5-7B (Featherless Backup)", input_cost_per_token: 0, output_cost_per_token: 0 }

litellm_settings:
  num_retries: 2
  request_timeout: 1200  # GLM-5.2(Code)は長い推論で最大845秒観測されているため延長
  # High: まずDeepSeek v4-flash(0731) → 失敗したら旧Highプール(Cerebras&DeepSeek-V3) → Low(まずDeepSeek v4-pro) → Low legacy(Gemini) → Backup Low(Qwen)
  fallbacks: [{"dccai-high": ["dccai-high-legacy"]}, {"dccai-high-legacy": ["dccai-low"]}, {"dccai-low": ["dccai-low-legacy"]}, {"dccai-low-legacy": ["dccai-backup-low"]}, {"dccai-code": ["dccai-high"]}]
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # Open WebUI(Pipe) からの認証キー
  database_url: os.environ/DATABASE_URL       # spend/トークン使用量の永続化用(Postgres)
  store_model_in_db: false                    # モデル定義はconfig.yamlのみで管理(DBに二重管理させない)
